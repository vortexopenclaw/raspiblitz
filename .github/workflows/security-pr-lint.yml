name: Security PR lint sweep
on:
  push:
    branches: ['ci/pr-health-20261031']
    paths: ['.github/workflows/security-pr-lint.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lint:
    name: PR ${{ matrix.pr }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: 5334
            sha: a55b4a73654517f4a454d54cf5ded258a4eeb6e8
          - pr: 5333
            sha: 516dde22ce74b376cb290f7a2148a782037b4cef
          - pr: 5332
            sha: f139ac3be94a803eb05d15b2b227416d0ba45135
          - pr: 5331
            sha: 80b3ba7f01feb1fec4c8aaf08d6eb92f6a17e7de
          - pr: 5329
            sha: fe8726f87f3f363b2e809862f3d8b5b5b792558b
          - pr: 5328
            sha: d9eff4e985d2c79599df2e8e39227e0b172f844e
          - pr: 5327
            sha: fc780e3c952f78b8980de8dfeec76dec1bf549c1
          - pr: 5326
            sha: e846e7a4d6f95c5489d9c3857ae399587154f6d4
          - pr: 5300
            sha: 9433364d2c5bddc6b00933c40c9d535c22dbc2fb
          - pr: 5283
            sha: 1134fe2b4efb1daa5a587af18d1443eb12b5d50b
    steps:
      - name: Check out exact PR head
        id: checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: vortexopenclaw/raspiblitz
          ref: ${{ matrix.sha }}
          persist-credentials: false
      - name: Spelling
        uses: crate-ci/typos@512fc24f32f44ab01972217aaaf3dc86ec234d53 # v1.50.2
        with:
          config: typos.toml
      - name: ShellCheck
        if: always() && steps.checkout.outcome == 'success'
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          severity: error
